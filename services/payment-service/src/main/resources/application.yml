spring:
  application:
    name: payment-service
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/payment
    username: ${DB_USER:payment}
    password: ${DB_PASSWORD:payment}
    pool:
      max-size: 10
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/payment
    user: ${DB_USER:payment}
    password: ${DB_PASSWORD:payment}

server:
  port: ${PORT:8084}
  shutdown: graceful

payment:
  psp-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
