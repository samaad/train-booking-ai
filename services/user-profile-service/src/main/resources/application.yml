spring:
  config:
    import: classpath:train-booking-observability.yml
  application:
    name: user-profile-service
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/profile
    username: ${DB_USER:profile}
    password: ${DB_PASSWORD:profile}
    pool:
      max-size: 10
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/profile
    user: ${DB_USER:profile}
    password: ${DB_PASSWORD:profile}
    locations: classpath:db/migration,classpath:db/outbox
    # Two independent migration streams (this service's V1.. and the shared outbox V1000): a later V3 sorts
    # below the applied V1000, so out-of-order application must be allowed. They never touch the same tables.
    out-of-order: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm (configured in Phase 4). Both set: keys are fetched lazily from the
          # JWK set, and tokens must carry this exact issuer. No discovery call at startup.
          issuer-uri: ${OIDC_ISSUER:http://localhost:8180/realms/train-booking}
          jwk-set-uri: ${OIDC_JWKS:http://localhost:8180/realms/train-booking/protocol/openid-connect/certs}
          audiences: train-api

server:
  port: ${PORT:8087}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
