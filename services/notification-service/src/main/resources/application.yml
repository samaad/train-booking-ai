spring:
  application:
    name: notification-service
  threads:
    virtual:
      enabled: false
  mongodb:
    uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/notification
    representation:
      uuid: standard # Boot 4 sets none, and encoding a UUID id then fails
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: notification-service
    listener:
      ack-mode: record

server:
  port: ${PORT:8086}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
