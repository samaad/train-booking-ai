spring:
  config:
    import: classpath:train-booking-observability.yml
  application:
    name: ticketing-service
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/ticketing
    username: ${DB_USER:ticketing}
    password: ${DB_PASSWORD:ticketing}
    pool:
      max-size: 10
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/ticketing
    user: ${DB_USER:ticketing}
    password: ${DB_PASSWORD:ticketing}
    locations: classpath:db/migration,classpath:db/outbox
    # Two independent migration streams (this service's V1.. and the shared outbox V1000): a later V3 sorts
    # below the applied V1000, so out-of-order application must be allowed. They never touch the same tables.
    out-of-order: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: ticketing-service
    listener:
      ack-mode: record
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm train-booking. Both set: keys come lazily from the JWK set (rotating), and tokens
          # must carry exactly this issuer. No discovery call at startup.
          issuer-uri: ${OIDC_ISSUER:http://localhost:8180/realms/train-booking}
          jwk-set-uri: ${OIDC_JWKS:http://localhost:8180/realms/train-booking/protocol/openid-connect/certs}
          audiences: train-api

server:
  port: ${PORT:8085}
  shutdown: graceful

ticketing:
  zone: Asia/Dubai
  # HMAC key for QR tokens (>= 32 bytes). The default is for local development only.
  qr-secret: ${TICKET_QR_SECRET:local-dev-only-qr-secret-change-me-0123456789}
  object-store:
    endpoint: ${OBJECT_STORE_URL:http://localhost:9190}
    region: ${OBJECT_STORE_REGION:me-central-1}
    bucket: ${OBJECT_STORE_BUCKET:tickets}
    access-key: ${OBJECT_STORE_ACCESS_KEY:local}
    secret-key: ${OBJECT_STORE_SECRET_KEY:local}
    path-style: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
