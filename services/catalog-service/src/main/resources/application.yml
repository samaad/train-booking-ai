spring:
  application:
    name: catalog-service
  threads:
    virtual:
      enabled: false # WebFlux event loop; virtual threads belong to the future MVC batch service
  mongodb:
    uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/catalog
  data:
    mongodb:
      representation:
        big-decimal: decimal128 # fares stored as exact decimals, not strings
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms

server:
  port: ${PORT:8081}
  shutdown: graceful

catalog:
  zone: Asia/Dubai
  search-cache-ttl: 10m
  seed: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
