spring:
  config:
    import: classpath:train-booking-observability.yml
  application:
    name: catalog-service
  threads:
    virtual:
      enabled: false # WebFlux event loop; virtual threads belong to the future MVC batch service
  mongodb:
    uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/catalog
  data:
    mongodb:
      representation:
        big-decimal: decimal128 # fares stored as exact decimals, not strings
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm train-booking. Both set: keys come lazily from the JWK set (rotating), and tokens
          # must carry exactly this issuer. No discovery call at startup.
          issuer-uri: ${OIDC_ISSUER:http://localhost:8180/realms/train-booking}
          jwk-set-uri: ${OIDC_JWKS:http://localhost:8180/realms/train-booking/protocol/openid-connect/certs}
          audiences: train-api

server:
  port: ${PORT:8081}
  shutdown: graceful

catalog:
  zone: Asia/Dubai
  search-cache-ttl: 10m
  seed: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
