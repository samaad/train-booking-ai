spring:
  application:
    name: booking-service
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/booking
    username: ${DB_USER:booking}
    password: ${DB_PASSWORD:booking}
    pool:
      max-size: 10
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/booking
    user: ${DB_USER:booking}
    password: ${DB_PASSWORD:booking}
    locations: classpath:db/migration,classpath:db/outbox
    # Two independent migration streams (this service's V1.. and the shared outbox V1000): a later V3 sorts
    # below the applied V1000, so out-of-order application must be allowed. They never touch the same tables.
    out-of-order: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: booking-service
    listener:
      ack-mode: record
  http:
    clients:
      connect-timeout: 1s
      read-timeout: 3s
    # @HttpExchange client groups (see ClientsConfiguration). No retries: the only calls made
    # here are reads, and mutating inter-service calls must never be blindly retried.
    serviceclient:
      inventory:
        base-url: ${INVENTORY_URL:http://localhost:8082}
      catalog:
        base-url: ${CATALOG_URL:http://localhost:8081}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm train-booking. Both set: keys come lazily from the JWK set (rotating), and tokens
          # must carry exactly this issuer. No discovery call at startup.
          issuer-uri: ${OIDC_ISSUER:http://localhost:8180/realms/train-booking}
          jwk-set-uri: ${OIDC_JWKS:http://localhost:8180/realms/train-booking/protocol/openid-connect/certs}
          audiences: train-api
      client:
        registration:
          train-services:
            client-id: train-services
            client-secret: ${TRAIN_SERVICES_SECRET:dev-only-train-services-secret}
            authorization-grant-type: client_credentials
            provider: keycloak
        provider:
          keycloak:
            token-uri: ${OIDC_TOKEN_URI:http://localhost:8180/realms/train-booking/protocol/openid-connect/token}

server:
  port: ${PORT:8083}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
