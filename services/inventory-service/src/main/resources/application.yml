spring:
  config:
    import: classpath:train-booking-observability.yml
  application:
    name: inventory-service
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/inventory
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
    pool:
      max-size: 10
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/inventory
    user: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
    locations: classpath:db/migration,classpath:db/outbox
    # Two independent migration streams (this service's V1.. and the shared outbox V1000): a later V3 sorts
    # below the applied V1000, so out-of-order application must be allowed. They never touch the same tables.
    out-of-order: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: inventory-service
    listener:
      ack-mode: record
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm train-booking. Both set: keys come lazily from the JWK set (rotating), and tokens
          # must carry exactly this issuer. No discovery call at startup.
          issuer-uri: ${OIDC_ISSUER:http://localhost:8180/realms/train-booking}
          jwk-set-uri: ${OIDC_JWKS:http://localhost:8180/realms/train-booking/protocol/openid-connect/certs}
          audiences: train-api

server:
  port: ${PORT:8082}
  shutdown: graceful

inventory:
  hold-ttl: 10m
  booking-horizon: 90d
  zone: Asia/Dubai
  contention-filter:
    enabled: true
    lock-ttl: 2s
  # 03-consistency: the sweeper is the total guarantee for expiry (the UPDATE's self-healing clause only
  # reclaims a seat when someone contends for it).
  sweeper:
    interval: 30s
    batch-size: 100
  # Seat layout per train and fare class. Train numbers and fare classes must match
  # catalog-service's seed data; seats are materialised lazily per travel date.
  trains:
    ER101: &standard-layout
      BUSINESS: { prefix: B, seats: 12 }
      ECONOMY: { prefix: E, seats: 48 }
    ER102: *standard-layout
    ER201: *standard-layout
    ER202: *standard-layout
    ER301:
      ECONOMY: { prefix: E, seats: 60 }
    ER302:
      ECONOMY: { prefix: E, seats: 60 }

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
