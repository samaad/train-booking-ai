# ticketing-service — values only; templates live in the common library chart.

image:
  repository: train-booking/ticketing-service
  tag: ""          # defaults to global.image.tag, then appVersion

port: 8085
replicas: 2

# Shared settings this service reads from global (oidc, serviceTokens, postgres, mongo, redis, kafka).
uses: [oidc, postgres, kafka]

env:
  OBJECT_STORE_URL: "https://s3.me-central-1.amazonaws.com"
  OBJECT_STORE_REGION: "me-central-1"
  OBJECT_STORE_BUCKET: "tickets"

# ENV_VAR: property under <global.externalSecrets.keyPrefix>/ticketing-service in the secret store.
secretEnv:
  DB_PASSWORD: db-password
  TICKET_QR_SECRET: qr-secret
  OBJECT_STORE_ACCESS_KEY: object-store-access-key
  OBJECT_STORE_SECRET_KEY: object-store-secret-key

javaOpts: "-XX:MaxRAMPercentage=75"
resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    memory: "768Mi"

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  cpuUtilization: 70
  podsMetric:
    name: http_server_requests_per_second
    averageValue: "50"

pdb:
  enabled: true

serviceMonitor:
  enabled: true
  interval: 15s

probes:
  startupFailureThreshold: 36   # 3 minutes

terminationGracePeriodSeconds: 45

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
writableDirs: []

nodeSelector: {}
tolerations: []
affinity: {}
nameOverride: ""
global: {}
