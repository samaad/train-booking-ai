# catalog-service — values only; templates live in the common library chart.

image:
  repository: train-booking/catalog-service
  tag: ""          # defaults to global.image.tag, then appVersion

port: 8081
replicas: 2

# Shared settings this service reads from global (oidc, serviceTokens, postgres, mongo, redis, kafka).
uses: [oidc, mongo, redis]

env: {}

# No secrets.
secretEnv: {}

javaOpts: "-XX:MaxRAMPercentage=75"
resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    memory: "768Mi"

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  cpuUtilization: 70
  podsMetric:
    name: http_server_requests_per_second
    averageValue: "50"

pdb:
  enabled: true

serviceMonitor:
  enabled: true
  interval: 15s

probes:
  startupFailureThreshold: 36   # 3 minutes

terminationGracePeriodSeconds: 45

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
writableDirs: []

nodeSelector: {}
tolerations: []
affinity: {}
nameOverride: ""
global: {}
