# Profile-gated local stack. gemma4 alone is ~9.6 GB on the host and Docker Desktop is
# capped at ~8 GB here, so run `core` plus the slice under development — never `full`
# alongside several JVMs.
#
#   docker compose -f infra/docker-compose.yml --profile core up -d
#   docker compose -f infra/docker-compose.yml --profile core --profile catalog up -d --build
#
# Ollama is NOT here: it runs natively on the host for Metal acceleration
# (OLLAMA_HOST=0.0.0.0, reached at http://host.docker.internal:11434).
#
# Upstreams/scrape targets use host.docker.internal so a service behaves the same whether it
# runs in this compose file or from the IDE.

name: train-booking

x-host-gateway: &host-gateway
  extra_hosts:
    - "host.docker.internal:host-gateway" # automatic on macOS/Windows, required on Linux

# Shared shape of every Spring service container.
x-service: &service
  healthcheck: # JRE image has no curl/wget; bash /dev/tcp hits the readiness probe on $PORT
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/$${PORT} && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
    interval: 5s
    timeout: 3s
    retries: 24
    start_period: 15s
  mem_limit: 512m

x-service-env: &service-env
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
  KAFKA_BOOTSTRAP: kafka:29092
  # Tokens carry the issuer browsers see (KC_HOSTNAME); keys and service tokens are fetched over the network.
  OIDC_ISSUER: http://localhost:8180/realms/train-booking
  OIDC_JWKS: http://keycloak:8080/realms/train-booking/protocol/openid-connect/certs
  OIDC_TOKEN_URI: http://keycloak:8080/realms/train-booking/protocol/openid-connect/token
  TRAIN_SERVICES_SECRET: ${TRAIN_SERVICES_SECRET:-dev-only-train-services-secret}
  # Traces → collector → Tempo; logs as structured JSON (ECS) carrying traceId/spanId.
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs

# Each service reaches its own database by name; per-service credentials come from the
# service's defaults (role = database name), created by postgres/init/01-databases.sh.
x-postgres-env: &postgres-env
  DB_HOST: postgres
  DB_PORT: 5432

services:

  # ---------------------------------------------------------------- core
  postgres:
    image: pgvector/pgvector:pg18
    profiles: [core, full, services, inventory, booking, payment, ticketing, profile, assistant]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    command: ["postgres", "-c", "max_connections=200"]
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql # pg18 images keep PGDATA in a versioned subdir
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 768m

  redis:
    image: redis:8.8.3-alpine
    profiles: [core, full, services, catalog, inventory]
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m

  # ---------------------------------------------------------------- mongo
  mongo:
    image: mongo:8.0.32
    profiles: [mongo, full, services, catalog, notification, assistant]
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    ports: ["${MONGO_PORT:-27017}:27017"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g

  # ---------------------------------------------------------------- kafka (KRaft, no ZooKeeper)
  kafka:
    image: apache/kafka:4.3.1
    profiles: [kafka, full, services, catalog, inventory, booking, payment, ticketing, notification, profile, assistant, availability]
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" # topics are declared, not conjured by typos
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx768m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    mem_limit: 1280m

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    profiles: [kafka, full]
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 512m

  # ---------------------------------------------------------------- auth
  keycloak-db:
    image: postgres:18.6-alpine
    profiles: [auth, full, services, catalog, inventory, booking, payment, ticketing, notification, profile, assistant]
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    profiles: [auth, full, services, catalog, inventory, booking, payment, ticketing, notification, profile, assistant]
    command: ["start-dev", "--import-realm"]
    ports: ["8180:8080"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      # One stable issuer (what browsers and tokens see), while services reach Keycloak over the network
      # as keycloak:8080 for JWKS and client-credentials tokens.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      TRAIN_SERVICES_SECRET: ${TRAIN_SERVICES_SECRET:-dev-only-train-services-secret}
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=70"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro # realm-export.json, built by keycloak/build-realm.sh
    healthcheck: # management port; the image has no curl
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
    depends_on:
      keycloak-db:
        condition: service_healthy
    mem_limit: 1g

  # ---------------------------------------------------------------- gateway
  # Kong stopped publishing OSS images after 3.9.x; 3.10+ ships only as kong/kong-gateway,
  # which runs in free mode without a license. Kong does routing + rate limiting ONLY —
  # JWT validation is authoritative in each service (see .claude/plan/05-security.md).
  kong:
    image: kong/kong-gateway:3.16.0.0
    profiles: [gateway, full]
    <<: *host-gateway
    ports:
      - "8000:8000"           # proxy
      - "127.0.0.1:8001:8001" # admin API — never expose beyond localhost
    environment:
      KONG_DATABASE: "off"
      KONG_NGINX_WORKER_PROCESSES: "2" # default is one per CPU (12): workers OOM-loop under mem_limit
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    volumes:
      - ./kong:/kong:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m

  # ---------------------------------------------------------------- observability
  # Every service exports traces to the collector, so it runs with any service profile; Tempo, Prometheus and
  # Grafana come with `observability`. Tempo 2.10 (maintained) rather than 3.x, whose architecture changed.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    profiles: [observability, full, services, catalog, inventory, booking, payment, ticketing, notification, profile, assistant, availability]
    command: ["--config=/etc/otelcol/config.yml"]
    ports:
      - "4317:4317" # OTLP gRPC (services run from the IDE export here too)
      - "4318:4318" # OTLP HTTP
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    mem_limit: 256m

  tempo:
    image: grafana/tempo:2.10.8
    profiles: [observability, full]
    command: ["-config.file=/etc/tempo.yml"]
    ports: ["3200:3200"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    mem_limit: 512m

  prometheus:
    image: prom/prometheus:v3.13.4
    profiles: [observability, full]
    <<: *host-gateway
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    mem_limit: 512m

  grafana:
    image: grafana/grafana:13.2.3
    profiles: [observability, full]
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, tempo]
    mem_limit: 384m

  # ---------------------------------------------------------------- object store (ticketing)
  # MinIO no longer publishes community images; s3mock is a maintained S3-compatible stand-in.
  s3mock:
    image: adobe/s3mock:5.2.3
    profiles: [objectstore, ticketing, services, full]
    ports: ["9190:9090"] # 9090 is Prometheus
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: tickets
    mem_limit: 384m

  # ---------------------------------------------------------------- application services
  # Build jars first:  ./mvnw -q package -DskipTests
  # One profile per service, or `services` for all seven (~3.5 GB of JVMs plus infra).
  catalog-service:
    <<: *service
    build: { context: .., dockerfile: infra/docker/service.Dockerfile, args: { SERVICE: catalog-service } }
    image: train-booking/catalog-service:dev
    profiles: [catalog, services, full]
    ports: ["8081:8081"]
    environment:
      <<: *service-env
      PORT: 8081
      MONGO_HOST: mongo
      REDIS_HOST: redis
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  inventory-service:
    <<: *service
    build: { context: .., dockerfile: infra/docker/service.Dockerfile, args: { SERVICE: inventory-service } }
    image: train-booking/inventory-service:dev
    profiles: [inventory, services, full]
    ports: ["8082:8082"]
    environment:
      <<: [*service-env, *postgres-env]
      PORT: 8082
      REDIS_HOST: redis
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  booking-service:
    <<: *service
    build: { context: .., dockerfile: infra/docker/service.Dockerfile, args: { SERVICE: booking-service } }
    image: train-booking/booking-service:dev
    profiles: [booking, services, full]
    ports: ["8083:8083"]
    environment:
      <<: [*service-env, *postgres-env]
      PORT: 8083
      INVENTORY_URL: http://inventory-service:8082
      CATALOG_URL: http://catalog-service:8081
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }

  payment-service:
    <<: *service
    build: { context: .., dockerfile: infra/docker/service.Dockerfile, args: { SERVICE: payment-service } }
    image: train-booking/payment-service:dev
    profiles: [payment, services, full]
    ports: ["8084:8084"]
    environment:
      <<: [*service-env, *postgres-env]
      PORT: 8084
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }

  ticketing-service:
    <<: *service
    build: { context: .., dockerfile: infra/docker/service.Dockerfile, args: { SERVICE: ticketing-service } }
    image: train-booking/ticketing-service:dev
    profiles: [ticketing, services, full]
    ports: ["8085:8085"]
    environment:
      <<: [*service-env, *postgres-env]
      PORT: 8085
      OBJECT_STORE_URL: http://s3mock:9090
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
      s3mock: { condition: service_started }

  notification-service:
    <<: *service
    build: { context: .., dockerfile: infra/docker/service.Dockerfile, args: { SERVICE: notification-service } }
    image: train-booking/notification-service:dev
    profiles: [notification, services, full]
    ports: ["8086:8086"]
    environment:
      <<: *service-env
      PORT: 8086
      MONGO_HOST: mongo
    depends_on:
      kafka: { condition: service_healthy }
      mongo: { condition: service_healthy }

  user-profile-service:
    <<: *service
    build: { context: .., dockerfile: infra/docker/service.Dockerfile, args: { SERVICE: user-profile-service } }
    image: train-booking/user-profile-service:dev
    profiles: [profile, services, full]
    ports: ["8087:8087"]
    environment:
      <<: [*service-env, *postgres-env]
      PORT: 8087
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }

  # The one blocking-with-offload service. Ollama runs on the HOST (Metal GPU), never in Docker:
  # start it with OLLAMA_HOST=0.0.0.0 so containers can reach it.
  ai-assistant-service:
    <<: [*service, *host-gateway]
    build: { context: .., dockerfile: infra/docker/service.Dockerfile, args: { SERVICE: ai-assistant-service } }
    image: train-booking/ai-assistant-service:dev
    profiles: [assistant, full]
    ports: ["8080:8080"]
    environment:
      <<: [*service-env, *postgres-env]
      PORT: 8080
      MONGO_HOST: mongo
      SPRING_AI_OLLAMA_BASE_URL: http://host.docker.internal:11434
      CATALOG_URL: http://catalog-service:8081
      INVENTORY_URL: http://inventory-service:8082
      BOOKING_URL: http://booking-service:8083
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
    mem_limit: 768m

  # Kafka Streams: seat-availability materialized view, queryable store, live seat map (WebSocket).
  seat-availability-streams:
    <<: *service
    build: { context: .., dockerfile: infra/docker/service.Dockerfile, args: { SERVICE: seat-availability-streams, MODULE_DIR: streams } }
    image: train-booking/seat-availability-streams:dev
    profiles: [availability, services, full]
    ports: ["8089:8089"] # 8088 is commonly ksqlDB
    environment:
      <<: *service-env
      PORT: 8089
      STREAMS_STATE_DIR: /tmp/kafka-streams
    depends_on:
      kafka: { condition: service_healthy }

volumes:
  tempo-data:
  postgres-data:
  mongo-data:
  kafka-data:
  keycloak-db-data:
