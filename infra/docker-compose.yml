# Profile-gated local stack. gemma4 alone is ~9.6 GB on the host and Docker Desktop is
# capped at ~8 GB here, so run `core` plus the slice under development — never `full`
# alongside several JVMs.
#
#   docker compose -f infra/docker-compose.yml --profile core up -d
#   docker compose -f infra/docker-compose.yml --profile core --profile catalog up -d --build
#
# Ollama is NOT here: it runs natively on the host for Metal acceleration
# (OLLAMA_HOST=0.0.0.0, reached at http://host.docker.internal:11434).
#
# Upstreams/scrape targets use host.docker.internal so a service behaves the same whether it
# runs in this compose file or from the IDE.

name: train-booking

x-host-gateway: &host-gateway
  extra_hosts:
    - "host.docker.internal:host-gateway" # automatic on macOS/Windows, required on Linux

services:

  # ---------------------------------------------------------------- core
  postgres:
    image: pgvector/pgvector:pg18
    profiles: [core, full]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    command: ["postgres", "-c", "max_connections=200"]
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql # pg18 images keep PGDATA in a versioned subdir
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 768m

  redis:
    image: redis:8.8.3-alpine
    profiles: [core, full]
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m

  # ---------------------------------------------------------------- mongo
  mongo:
    image: mongo:8.0.32
    profiles: [mongo, full]
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    ports: ["${MONGO_PORT:-27017}:27017"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g

  # ---------------------------------------------------------------- kafka (KRaft, no ZooKeeper)
  kafka:
    image: apache/kafka:4.3.1
    profiles: [kafka, full]
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" # topics are declared, not conjured by typos
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx768m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    mem_limit: 1280m

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    profiles: [kafka, full]
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 512m

  # ---------------------------------------------------------------- auth
  keycloak-db:
    image: postgres:18.6-alpine
    profiles: [auth, full]
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    profiles: [auth, full]
    command: ["start-dev", "--import-realm"]
    ports: ["8180:8080"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=70"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro # realm-export.json lands here in Phase 4
    depends_on:
      keycloak-db:
        condition: service_healthy
    mem_limit: 1g

  # ---------------------------------------------------------------- gateway
  # Kong stopped publishing OSS images after 3.9.x; 3.10+ ships only as kong/kong-gateway,
  # which runs in free mode without a license. Kong does routing + rate limiting ONLY —
  # JWT validation is authoritative in each service (see .claude/plan/05-security.md).
  kong:
    image: kong/kong-gateway:3.16.0.0
    profiles: [gateway, full]
    <<: *host-gateway
    ports:
      - "8000:8000"           # proxy
      - "127.0.0.1:8001:8001" # admin API — never expose beyond localhost
    environment:
      KONG_DATABASE: "off"
      KONG_NGINX_WORKER_PROCESSES: "2" # default is one per CPU (12): workers OOM-loop under mem_limit
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    volumes:
      - ./kong:/kong:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m

  # ---------------------------------------------------------------- observability
  # Tempo + OTel collector are added in Phase 6 with tracing (Tempo is now 3.x).
  prometheus:
    image: prom/prometheus:v3.13.4
    profiles: [observability, full]
    <<: *host-gateway
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    mem_limit: 512m

  grafana:
    image: grafana/grafana:13.2.3
    profiles: [observability, full]
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]
    mem_limit: 384m

  # ---------------------------------------------------------------- application services
  # Build jars first: ./mvnw -q package -DskipTests
  catalog-service:
    build:
      context: ..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: catalog-service
    image: train-booking/catalog-service:dev
    profiles: [catalog, full]
    ports: ["8081:8081"]
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    healthcheck: # JRE image has no curl/wget; bash /dev/tcp hits the readiness probe
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8081 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    mem_limit: 512m

volumes:
  postgres-data:
  mongo-data:
  kafka-data:
  keycloak-db-data:
