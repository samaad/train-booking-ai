# DB-less declarative config (05-security). Kong OSS does what it is good at — routing, rate limiting,
# CORS, request shaping — and NO authentication: its bundled jwt plugin cannot rotate JWKS (a key rotation
# becomes an outage), checks no audience or scope, and CVE-2026-14916 bypassed it. Every service validates
# the JWT itself against Keycloak's JWKS. Never enable the jwt plugin here.
_format_version: "3.0"

# notification-service has no public API (event-driven only), so it has no route.
services:
  - name: catalog-service
    url: http://host.docker.internal:8081
    routes:
      - name: catalog
        paths: ["/api/catalog"]
        protocols: [http, https] # 3.16 defaults routes to https-only (426); plain http is local-dev only
        strip_path: true

  - name: inventory-service
    url: http://host.docker.internal:8082
    routes:
      - name: inventory
        paths: ["/api/inventory"]
        protocols: [http, https] # 3.16 defaults routes to https-only (426); plain http is local-dev only
        strip_path: true

  - name: booking-service
    url: http://host.docker.internal:8083
    routes:
      - name: booking
        paths: ["/api/booking"]
        protocols: [http, https] # 3.16 defaults routes to https-only (426); plain http is local-dev only
        strip_path: true

  - name: payment-service
    url: http://host.docker.internal:8084
    routes:
      - name: payment
        paths: ["/api/payment"]
        protocols: [http, https] # 3.16 defaults routes to https-only (426); plain http is local-dev only
        strip_path: true

  - name: ticketing-service
    url: http://host.docker.internal:8085
    routes:
      - name: ticketing
        paths: ["/api/ticketing"]
        protocols: [http, https] # 3.16 defaults routes to https-only (426); plain http is local-dev only
        strip_path: true

  - name: user-profile-service
    url: http://host.docker.internal:8087
    routes:
      - name: profile
        paths: ["/api/profile"]
        protocols: [http, https] # 3.16 defaults routes to https-only (426); plain http is local-dev only
        strip_path: true

  - name: ai-assistant-service
    url: http://host.docker.internal:8080
    read_timeout: 180000 # SSE chat: a turn may run up to the 120 s model timeout per round
    routes:
      - name: assistant
        paths: ["/api/assistant"]
        protocols: [http, https]
        strip_path: true
        response_buffering: false # SSE chat: stream tokens through as they arrive

plugins:
  - name: rate-limiting
    config:
      minute: 600
      policy: local
  # Identity comes only from the validated token. Strip any identity-looking header a client sends, so no
  # service (or future code) can be tricked into trusting it.
  - name: request-transformer
    config:
      remove:
        headers:
          - X-User-Id
          - X-User-Name
          - X-User-Email
          - X-User-Roles
          - X-Forwarded-User
          - X-Authenticated-User
          - X-Remote-User
  - name: request-size-limiting
    config:
      allowed_payload_size: 1
      size_unit: megabytes
  - name: cors
    config:
      origins: ["http://localhost:5173"] # train-web (Keycloak redirect URI origin)
      methods: [GET, POST, PUT, DELETE, OPTIONS]
      headers: [Authorization, Content-Type, Idempotency-Key, Accept]
      exposed_headers: [Location]
      credentials: false # bearer tokens, not cookies
      max_age: 600
