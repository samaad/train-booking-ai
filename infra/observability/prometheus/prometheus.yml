global:
  scrape_interval: 15s

scrape_configs:
  - job_name: spring-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8081 # catalog-service
          - host.docker.internal:8082 # inventory-service
          - host.docker.internal:8083 # booking-service
          - host.docker.internal:8084 # payment-service
          - host.docker.internal:8085 # ticketing-service
          - host.docker.internal:8086 # notification-service
          - host.docker.internal:8087 # user-profile-service
          - host.docker.internal:8080 # ai-assistant-service
